# Grype findings to let pass, read by the container-scan job. Each rule names the package version it covers, so an image
# that moves past that version is scanned in full again.
#
# The Caddy binary in caddy:2.11.9-alpine, the newest Caddy image (2026-11-09), is built with golang.org/x/net v0.60.0,
# go-jose v3.0.5 and klauspost/compress v1.20.1. x/net 0.62.0 and compress 1.20.2 fix theirs, and go-jose v3 has no fix
# at all, but no Caddy release carries them yet. Bump the caddy image once one does.
ignore:
  - vulnerability: GO-2026-6860
    package: { name: golang.org/x/net, version: v0.60.0, location: /usr/bin/caddy }
    reason: No Caddy release has the fix yet. Review by 2027-02-04
  - vulnerability: GHSA-mgcc-cww5-fp2q
    package: { name: github.com/go-jose/go-jose/v3, version: v3.0.5, location: /usr/bin/caddy }
    reason: go-jose v3 has no fix. Clears once Caddy drops v3. Review by 2027-02-04
  - vulnerability: GO-2026-6865
    package: { name: github.com/klauspost/compress, version: v1.20.1, location: /usr/bin/caddy }
    reason: No Caddy release has the fix yet. Review by 2027-02-04
