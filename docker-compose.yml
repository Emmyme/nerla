# Base configuration, shared by dev and prod.
# Dev:  `docker compose up` (auto-loads docker-compose.override.yml)
# Prod: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`

name: nerla

services:
  postgres:
    image: postgres:15-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    container_name: nerla-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Setup writes DB_PASSWORD. No default, so DB_PASSWORD_FILE can stand in for it
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      POSTGRES_DB: ${DB_NAME:-nerla}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nerla-network

  garage:
    image: dxflrs/garage:v2.2.0@sha256:45a61ce3f7c9c24fc23d9ed2b09b27ed560ab87b34605d175d5c588f539c24e4
    container_name: nerla-garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - nerla-network
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  livekit:
    image: livekit/livekit-server:v1.13.1@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    container_name: nerla-livekit
    # All call media shares one UDP port. Publishing a port range makes Docker map every port one by one, which takes
    # minutes and, with its userland proxy, a process per port. The flag wins over any range in an older livekit.yaml
    command: --config /etc/livekit.yaml --udp-port 7882
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    networks:
      - nerla-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    container_name: nerla-server
    # A secret NAME can come from NAME_FILE, a file in ./secrets, which is /run/secrets in here. Secrets have no
    # defaults, so a NAME_FILE never clashes with one. The server builds its database address from the DB_ settings
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-nerla}
      DB_SSL: ${DB_SSL:-false}
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-nerla-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EXPOSE_RESET_TOKEN: ${EXPOSE_RESET_TOKEN:-false}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PORT: 5000
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ws://livekit:7880 # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket -- internal Docker network, no TLS between containers
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-}
      AI_MASTER_KEY: ${AI_MASTER_KEY:-}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      AI_MASTER_KEY_FILE: ${AI_MASTER_KEY_FILE:-}
      S3_ACCESS_KEY_FILE: ${S3_ACCESS_KEY_FILE:-}
      S3_SECRET_KEY_FILE: ${S3_SECRET_KEY_FILE:-}
      EMAIL_PASS_FILE: ${EMAIL_PASS_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
      # Uploaded files when STORAGE_DRIVER=local
      - files:/data/files
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      livekit:
        condition: service_healthy
    # The server takes up to 25 seconds to stop, longer than the 10 seconds Docker gives by default
    stop_grace_period: 30s
    networks:
      - nerla-network

volumes:
  postgres_data:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local
  files:
    driver: local

networks:
  nerla-network:
    driver: bridge
